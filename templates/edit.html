<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASS</title>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 2rem 1rem;
            text-align: center;
        }

        h1 {
            font-weight: 700;
            letter-spacing: -0.025em;
            margin: 0;
            color: var(--primary-color);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinha ao topo para não sumir em telas pequenas */
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 800px;
            border: 1px solid var(--border-color);
        }

        #editor {
            display: flex;
            flex-direction: column;
            gap: 1.5rem; /* Espaço entre o texto e o botão */
        }

        #note-body {
            width: 100%;
            min-height: 400px;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Fira Code', monospace; /* Fonte mono para código/notas */
            font-size: 1rem;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        #save-button {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            align-self: flex-end; /* Alinha o botão à direita, embaixo da caixa */
        }

        #save-button:hover {
            background-color: var(--primary-hover);
        }

        #save-button:active {
            transform: scale(0.98);
        }

    </style>
</head>
<body>
    <main>
        <div class="container">

            <div id="save-message-box"></div>

            <form id="editor">
                <!-- Area de formulário não aparente para o usuário que contenha o titulo -->
                <input id="note-title" type="hidden" name="title" value="{{.Title}}">
                <textarea id="note-body" name="body" placeholder="Start writing your thoughts!">{{.Body}}</textarea>
                <button id="save-button">Save Changes</button>
            </form>

        </div>
    </main>
</body>

<script>
    function displayMessage(message) {
        var saveMessageBox = document.getElementById("save-message-box");
        var pMessage = document.createElement('p');
        pMessage.id = "message"

        pMessage.textContent = message;
        saveMessageBox.appendChild(pMessage);
    }

    function removeMessage() {
        var saveMessageBox = document.getElementById("save-message-box");
        var pMessage = document.getElementById("message");

        saveMessageBox.removeChild(pMessage);
    }


    function getSaveRequest() {
        var editorForm = document.getElementById("editor");

        var data = new FormData(editorForm);
        data = Object.fromEntries(data.entries());

        return {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
        };        
    }

    async function saveNote(event) {
        event.preventDefault();

        var req = getSaveRequest();

        var res = await fetch("/save/", req).catch(error => console.log(error.message));


        var resData = await res.json();
       
        displayMessage(resData.Message);

        setTimeout(() => {
            removeMessage()
        }, 2000)
    }

    var saveButton = document.getElementById("save-button");
    saveButton.addEventListener("click", saveNote);

</script>

</html>
